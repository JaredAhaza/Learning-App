{% extends 'includes/base.html' %}
{% load static %}

{% block content %}
<main>
<div class="container mt-4">
    <div class="row">
        <div class="col-md-8 offset-md-2">
            <div class="card">
                <div class="card-header">
                    <h3>Request Enrollment</h3>
                </div>
                <div class="card-body">
                    <h4>{{ cohort.course.course_name }}</h4>
                    <p><strong>Cohort:</strong> {{ cohort.name }}</p>
                    <p><strong>Start Date:</strong> {{ cohort.start_date }}</p>
                    <p><strong>End Date:</strong> {{ cohort.end_date }}</p>
                    
                    <form method="POST">
                        {% csrf_token %}
                        <div class="form-group">
                            <label for="notes">Additional Notes (Optional):</label>
                            <textarea class="form-control" id="notes" name="notes" rows="3" 
                                    placeholder="Please provide any additional information that might help with your enrollment request"></textarea>
                        </div>
                        <div class="mt-3">
                            <button type="submit" class="btn btn-primary">Submit Request</button>
                            <a href="{% url 'student_dashboard' %}" class="btn btn-secondary">Cancel</a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
</main>
{% endblock %}
