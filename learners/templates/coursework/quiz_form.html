{% extends 'includes/base.html' %}
{% block content %}
<div class="container mt-4">
  <h2>{% if form.instance.pk %}Edit Quiz{% else %}Create Quiz{% endif %} for {{ lesson.title }}</h2>
  <form method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit" class="btn btn-primary">Save Quiz</button>
  </form>
</div>
{% endblock %}
