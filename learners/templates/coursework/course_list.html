<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Course List</title>
    <link rel="stylesheet" href="styles.css">
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f5f5f5;
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            padding: 20px;
        }
        h2 {
            text-align: center;
            margin-top: 100px; /* Adjust this value as needed */
            background: white;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0px 4px 6px rgba(0, 0, 0, 0.1);
            width: 400px;
        }
        table {
            width: 80%;
            border-collapse: collapse;
            background: white;
            box-shadow: 0px 4px 6px rgba(0, 0, 0, 0.1);
            border-radius: 8px;
            overflow: hidden;
        }
        th, td {
            padding: 12px;
            border-bottom: 1px solid #ddd;
            text-align: left;
        }
        th {
            background-color: #007bff;
            color: white;
        }
        tr:hover {
            background-color: #f1f1f1;
        }
    </style>
</head>
<body>
    <nav style="
                position: fixed;
                top: 20px;
                left: 20px;
                right: 20px;
                background-color: #343a40;
                color: white;
                padding: 10px 20px;
                display: flex;
                justify-content: space-between;
                align-items: center;
                border-radius: 8px;
                box-shadow: 0px 4px 6px rgba(0, 0, 0, 0.1);
                z-index: 1000;
            ">
    <div style="font-size: 20px; font-weight: bold;">Course List</div>
    <ul style="
        list-style: none;
        display: flex;
        gap: 20px;
        margin: 0;
        padding: 0;
    ">
        <li><a href='/' style="color: white; text-decoration: none;">Home</a></li>
        <li><a href='/add_course' style="color: white; text-decoration: none;">Add Courses</a></li>
        <li><a href='/logout' style="color: white; text-decoration: none;">Logout</a></li>
    </ul>
</nav>
    <h2>Available Courses</h2>
    
    <table>
        <thead>
            <tr>
                <th>Title</th>
                <th>Description</th>
                <th>Instructions</th>
                <th>Duration (weeks)</th>
            </tr>
        </thead>
        <tbody>
            {% for course in courses %}
            <tr>
                <td>{{ course.course_name }}</td>
                <td>{{ course.description }}</td>
                <td>{{ course.course_code }}</td>
            </tr>
            {% endfor %}
        </tbody>
    </table>

</body>
</html>
